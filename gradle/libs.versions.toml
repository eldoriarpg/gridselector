[versions]
jackson = "3.2.4"
utilities = "3.7.0"
paper = "1.21.11-R0.1-SNAPSHOT"
fawe = "2.16.1"
plotsquared = "7.6.0"
junit = "6.1.3"
palantir = "2.102.0"

[libraries]
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
jackson-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }

eldoutil-plugin = { module = "de.eldoria.util:plugin", version.ref = "utilities" }
eldoutil-jackson = { module = "de.eldoria.util:jackson-configuration", version.ref = "utilities" }
eldoutil-updater = { module = "de.eldoria.util:updater", version.ref = "utilities" }

schematicbrushreborn-api = "de.eldoria:schematicbrushreborn-api:3.0.1"
jetbrains-annotations = "org.jetbrains:annotations:26.1.0"

paper = { module = "io.papermc.paper:paper-api", version.ref = "paper" }

fawe-core = { module = "com.fastasyncworldedit:FastAsyncWorldEdit-Core", version.ref = "fawe" }
fawe-bukkit = { module = "com.fastasyncworldedit:FastAsyncWorldEdit-Bukkit", version.ref = "fawe" }

plotsquared-core = { module = "com.intellectualsites.plotsquared:plotsquared-core", version.ref = "plotsquared" }
plotsquared-bukkit = { module = "com.intellectualsites.plotsquared:plotsquared-bukkit", version.ref = "plotsquared" }
worldguard-bukkit = "com.sk89q.worldguard:worldguard-bukkit:7.0.20"
guice = "com.google.inject:guice:7.0.0"

junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }

[bundles]
jackson = ["jackson-databind", "jackson-annotations", "jackson-yaml"]
utilities = ["eldoutil-jackson", "eldoutil-plugin", "eldoutil-updater"]

[plugins]
spotless = { id = "com.diffplug.spotless", version = "8.10.4" }
publishdata = { id = "de.chojo.publishdata", version = "2.3.0" }
publishdata-manifest = { id = "de.chojo.publishdata.manifest", version = "2.3.0" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
pluginyml-bukkit = { id = "de.eldoria.plugin-yml.bukkit", version = "0.9.0" }
runserver = { id = "xyz.jpenilla.run-paper", version = "3.1.0" }
